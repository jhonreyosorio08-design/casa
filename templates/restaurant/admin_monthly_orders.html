<section
    class="panel activity"
    style="margin-top: 14px"
>

    <div class="panelhead">

        <h2>
            Order trend &middot; last 12 months
        </h2>

        <span class="subtle">
            Monthly order volume
        </span>

    </div>


    <div class="bars">

        {% for row in monthly_orders %}

        <div class="day">

            <div
                class="bar"
                title="{{ row.count }} orders"
                style="height: {{ row.height }}%"
            ></div>

            <span class="daylabel">
                {{ row.label }} &middot; {{ row.count }}
            </span>

        </div>

        {% endfor %}

    </div>

</section>
