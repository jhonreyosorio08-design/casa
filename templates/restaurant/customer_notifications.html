{% if notifications %}

<section class="mb-8 border border-ink/10 bg-white p-5 md:p-6">

    <div class="flex items-center justify-between">

        <h2 class="font-serif text-2xl">
            Notifications
        </h2>

        {% if unread_notifications %}

        <span class="bg-gold px-3 py-1 text-xs text-white">
            {{ unread_notifications }} new
        </span>

        {% endif %}

    </div>


    <div class="mt-4 divide-y divide-ink/10">

        {% for note in notifications %}

        <div
            class="flex flex-wrap items-center justify-between gap-3 py-3"
        >

            <div>

                <p
                    class="text-sm {% if not note.is_read %}font-semibold{% endif %}"
                >
                    {{ note.message }}
                </p>

                <p class="mt-1 text-xs text-ink/50">
                    {{ note.created_at|date:'M j, Y · g:i A' }}
                </p>

            </div>


            {% if not note.is_read %}

            <form method="post">

                {% csrf_token %}

                <input
                    type="hidden"
                    name="notification_id"
                    value="{{ note.pk }}"
                >

                <button
                    class="text-xs text-clay underline"
                    type="submit"
                >
                    Mark read
                </button>

            </form>

            {% endif %}

        </div>

        {% endfor %}

    </div>

</section>

{% endif %}
