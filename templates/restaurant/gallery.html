{% extends 'restaurant/base.html' %}
{% load static %}


{% block title %}
    Gallery | Casa Sonata
{% endblock %}


{% block content %}

<!-- =========================================================
     HERO SECTION
========================================================= -->

<section class="bg-ink px-6 pb-16 pt-40 text-center text-white">

    <p class="text-xs font-bold uppercase tracking-[.3em] text-gold">
        A glimpse inside
    </p>

    <h1 class="mt-4 font-serif text-6xl">
        The Casa Sonata table
    </h1>

</section>


<!-- =========================================================
     GALLERY SECTION
========================================================= -->

<section class="mx-auto max-w-7xl px-6 py-12 lg:px-10">

    <div class="columns-1 gap-5 md:columns-2 lg:columns-3">








        <figure class="mb-5 break-inside-avoid overflow-hidden bg-olive">

            <img
                class="w-full object-cover transition duration-500 hover:scale-105"
                src="{% static 'images/9.jpg' %}"
                alt="Plated dish"
            >

            <figcaption class="p-4 text-sm text-white">
                Plated Dish
            </figcaption>

        </figure>



        <figure class="mb-5 break-inside-avoid overflow-hidden bg-olive">

            <img
                class="w-full object-cover transition duration-500 hover:scale-105"
                src="{% static 'images/10.jpg' %}"
                alt="Plated dish"
            >

            <figcaption class="p-4 text-sm text-white">
                Plated Dish
            </figcaption>

        </figure>




        <figure class="mb-5 break-inside-avoid overflow-hidden bg-olive">

            <img
                class="w-full object-cover transition duration-500 hover:scale-105"
                src="{% static 'images/11.jpg' %}"
                alt="Plated dish"
            >

            <figcaption class="p-4 text-sm text-white">
                Plated Dish
            </figcaption>

        </figure>


    </div>

</section>


{% endblock %}
