{% extends 'restaurant/base.html' %}{% block title %}Gallery | Casa Sonata{% endblock %}{% block content %}
<section class="bg-ink px-6 pb-16 pt-40 text-center text-white"><p class="text-xs font-bold uppercase tracking-[.3em] text-gold">A glimpse inside</p><h1 class="mt-4 font-serif text-6xl">The Casa Sonata table</h1></section>
<section class="mx-auto max-w-7xl px-6 py-12 lg:px-10"><div class="columns-1 gap-5 md:columns-2 lg:columns-3">{% for photo in gallery %}<figure class="mb-5 break-inside-avoid overflow-hidden bg-olive"><img class="w-full object-cover transition duration-500 hover:scale-105" src="{{ photo.image.url }}" alt="{{ photo.title }}"><figcaption class="p-4 text-sm text-white">{{ photo.title }}</figcaption></figure>{% empty %}<img class="mb-5 w-full break-inside-avoid" src="https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=900&q=80" alt="Casa Sonata dining room"><img class="mb-5 w-full break-inside-avoid" src="https://images.unsplash.com/photo-1544148103-0773bf10d330?auto=format&fit=crop&w=900&q=80" alt="Fresh pasta"><img class="mb-5 w-full break-inside-avoid" src="https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80" alt="Restaurant interior"><img class="mb-5 w-full break-inside-avoid" src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=900&q=80" alt="Dinner service"><img class="mb-5 w-full break-inside-avoid" src="https://images.unsplash.com/photo-1476224203421-9ac39bcb3327?auto=format&fit=crop&w=900&q=80" alt="Italian cuisine"><img class="mb-5 w-full break-inside-avoid" src="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=900&q=80" alt="Plated dish">{% endfor %}</div></section>
{% endblock %}
