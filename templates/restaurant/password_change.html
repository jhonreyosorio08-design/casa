{% extends 'restaurant/base.html' %}

{% block title %}
    Change password | Casa Sonata
{% endblock %}


{% block content %}

<section class="bg-ink px-6 pb-10 pt-32 text-cream">

    <div class="mx-auto max-w-3xl">

        <p class="text-xs uppercase tracking-[.25em] text-gold">
            Account security
        </p>

        <h1 class="mt-3 font-serif text-4xl">
            Change password
        </h1>

    </div>

</section>


<section class="px-6 py-10">

    <div
        class="mx-auto max-w-3xl border border-ink/10 bg-white p-6 md:p-8"
    >

        <p class="mb-6 text-sm text-ink/60">
            Choose a strong password you do not use on other sites.
        </p>


        <form
            method="post"
            class="password-form"
        >

            {% csrf_token %}

            {{ form.as_p }}


            <button
                class="mt-4 bg-gold px-6 py-3 text-xs font-bold uppercase tracking-widest text-white"
                type="submit"
            >
                Update password
            </button>

        </form>


        <a
            class="mt-5 inline-block text-sm text-ink/60 underline"
            href="{% url 'account_profile' %}"
        >
            Cancel
        </a>

    </div>

</section>


<style>

    .password-form p {
        margin: 0 0 18px;
    }

    .password-form label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: bold;
    }

    .password-form input {
        width: 100%;
        border: 1px solid #d8d6ce;
        padding: 12px;
    }

    .password-form ul {
        color: #796c5f;
        font-size: 12px;
        padding-left: 18px;
    }

    .password-form .helptext {
        display: block;
        margin-top: 6px;
        color: #777;
        font-size: 12px;
    }

</style>


{% endblock %}
